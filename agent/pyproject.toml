[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "test-script-generator"
version = "0.1.0"
description = "LangGraph-based TestNG automation script generator."
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
test-script-generator = "test_script_generator.cli:main"
test-script-generator-api = "test_script_generator.server:main"

[tool.setuptools.packages.find]
where = ["."]
